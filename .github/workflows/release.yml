name: release

# Pushing a tag such as v2026.11.1 builds ready-to-run files for every platform and publishes them as a GitHub
# release, so that nobody has to build discordo to use it. A version with a hyphen, such as v2026.11.1-rc.1, is
# published as a pre-release. Running it from the Actions tab builds the same files to test, which are downloaded
# from the run's page, and publishes them only if "publish" is ticked.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, such as v2026.11.1 (a hyphen, as in v2026.11.1-rc.1, makes a pre-release)"
        required: true
        default: "v0.0.0-dev"
        type: string
      publish:
        description: "Publish as a GitHub release (unticked, the files are only on the run's page)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest Ubuntu runners, so that the binaries run on older distributions too.
          - { os: ubuntu-22.04, name: linux_x86_64 }
          - { os: ubuntu-22.04-arm, name: linux_arm64 }
          - { os: windows-latest, name: windows_x86_64, mpv: x86_64 }
          - { os: windows-11-arm, name: windows_arm64, mpv: aarch64 }
          # Built on the Intel runner too, for Apple silicon, as GitHub's Apple silicon runners have gone unassigned
          # for long enough that the build was cancelled.
          - { os: macos-26-intel, name: macos_arm64, goarch: arm64, cc: clang -arch arm64 }
          - { os: macos-26-intel, name: macos_x86_64 }
          # For Termux. Voice needs the audio libraries of a desktop, so this one is text, images and streams' video.
          - { os: ubuntu-24.04, name: android_arm64, android: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Voice support requires a C compiler, and the one on this runner targets x64.
      - if: ${{ matrix.os == 'windows-11-arm' }}
        run: |
          C:\msys64\usr\bin\pacman -Sy --noconfirm mingw-w64-clang-aarch64-clang
          echo "C:\msys64\clangarm64\bin" >> $env:GITHUB_PATH
          echo "CC=clang" >> $env:GITHUB_ENV

      # The icon and description that Windows shows for discordo.exe, from winres, which go build takes from the
      # .syso files this makes.
      - name: Add the icon
        if: ${{ runner.os == 'Windows' }}
        run: go run github.com/tc-hib/go-winres@latest make --in winres/winres.json --arch amd64,arm64

      - name: Build
        if: ${{ !matrix.android }}
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_ENABLED: ${{ matrix.goarch && '1' || '' }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags=-s -o "dist/discordo$([ "$RUNNER_OS" = Windows ] && echo .exe)" .

      # The clipboard needs cgo on Android, so the NDK's compiler builds it.
      - name: Build for Android
        if: ${{ matrix.android }}
        run: |
          mkdir -p dist
          CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags=-s -tags no_voice -o dist/discordo .

      # Windows has no package manager that most have mpv from, so its releases bring the latest build of
      # shinchiro/mpv-winbuild-cmake in an mpv folder, where discordo finds it, with where its source is.
      - name: Add mpv
        if: ${{ matrix.mpv }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-${{ matrix.mpv }}-2*.7z" --dir mpv-download
          7z x -o"dist/mpv" mpv-download/*.7z
          # The archive may hold mpv in a folder of its own.
          exe="$(find dist/mpv -name mpv.exe | head -n 1)"
          test -n "$exe"
          if [ "$(dirname "$exe")" != dist/mpv ]; then
            inner="$(dirname "$exe")"
            mv "$inner"/* dist/mpv/
            rmdir "$inner"
          fi
          test -f dist/mpv/mpv.exe
          # yt-dlp beside mpv.exe, where mpv looks for it, plays videos linked from sites such as YouTube.
          if [ "${{ matrix.mpv }}" = x86_64 ]; then
            curl -fsSL -o dist/mpv/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          else
            curl -fsSL -o dist/mpv/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_arm64.exe
          fi
          printf '%s\n' "mpv is free software under the GPL version 2 or later: https://mpv.io" \
            "Its source is at https://github.com/mpv-player/mpv, and this build of it is from" \
            "https://github.com/shinchiro/mpv-winbuild-cmake/releases, as $(basename mpv-download/*.7z)." \
            "" "yt-dlp.exe, which mpv plays videos from sites with, is public domain (the Unlicense):" \
            "https://github.com/yt-dlp/yt-dlp" > dist/mpv/SOURCE.txt

      - name: Package
        shell: bash
        run: |
          cp README.md LICENSE dist/
          archive="discordo_${VERSION}_${{ matrix.name }}"
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a -tzip "../$archive.zip" .)
          else
            tar -czf "$archive.tar.gz" -C dist .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: discordo_*

  release:
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum discordo_* > SHA256SUMS.txt
      # The release creates the tag at the commit built if it was run from the Actions tab.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in v*) ;; *) echo "The version must start with v, as in v2026.11.1" >&2; exit 1 ;; esac
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes $prerelease \
            discordo_* SHA256SUMS.txt
